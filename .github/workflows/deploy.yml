name: Deploy with Docker

on:
    push:
        branches: [main]

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Deploy to VPS via SSH
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ secrets.HOST }}
                  username: ${{ secrets.USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  script: |
                      # 1. On se déplace dans le dossier que vous venez de trouver
                      cd /root/jacob/neon-portfolio-core

                      # 2. On met à jour le code depuis GitHub
                      git pull origin main 

                      # 3. On reconstruit l'image Docker avec les changements
                      docker build -t react-app .

                      # 4. On nettoie l'ancien container s'il existe
                      docker stop react-app || true
                      docker rm react-app || true

                      # 5. On lance le nouveau container sur le port 8080
                      docker run -d --name react-app -p 8080:8080 react-app
